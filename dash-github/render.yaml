# ============================================================
# ZAMANI BURGER — Render Blueprint (backend + API)
# Connect the GitHub repo in Render → "New +" → "Blueprint".
# Then create a free Postgres on Neon and paste DATABASE_URL.
# ============================================================
services:
  - type: web
    name: zamaniburger-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn zamaniburger_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
