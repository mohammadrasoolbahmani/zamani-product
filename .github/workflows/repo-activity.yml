name: Keep scheduled workflows active

# GitHub automatically disables scheduled workflows after 60 days without
# repository activity. This monthly heartbeat commits a timestamp so the
# keep-alive schedule keeps running.
#
# The push trigger is limited to changes of this workflow file, so it can be
# used to verify the write permission without creating a commit loop.

on:
  push:
    paths:
      - ".github/workflows/repo-activity.yml"
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update heartbeat file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: scheduled workflows heartbeat"
          git push
